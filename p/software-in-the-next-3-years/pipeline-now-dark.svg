<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">Now the communication is the bottleneck</title>
<desc id="desc">2026: the agent, wrapped in a harness, plans, calls tools and works for hours. The two links are now the bottleneck. Between you and the agent, everything you see has to become words and you read long answers. Between the agent and the software, screenshots, clicks and file reads burn tokens before the work starts.</desc>
