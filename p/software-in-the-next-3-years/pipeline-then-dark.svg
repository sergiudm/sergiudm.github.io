<text x="449" y="392.96" class="f-on" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.1">BOTTLENECK</text>
<text x="512" y="393.5" class="f-hot" font-size="11.5" font-weight="800" letter-spacing="1.1">THE AGENT</text>
<text x="396" y="429" class="f-ink" font-size="17.5" font-weight="700">The agent wasn't smart enough</text>
<text x="396" y="453" class="f-ink2" font-size="14">It lost the plan, repeated itself and stopped too early.</text>
<text x="396" y="473" class="f-ink2" font-size="14">A chat box and a few tools were all it could use.</text>
