<text x="386" y="215" font-size="14" text-anchor="middle"><tspan class="f-ink" font-weight="700">write</tspan><tspan class="f-muted"> a prompt</tspan></text>
<text x="386" y="300" font-size="14" text-anchor="middle"><tspan class="f-ink" font-weight="700">read</tspan><tspan class="f-muted"> an answer</tspan></text>
