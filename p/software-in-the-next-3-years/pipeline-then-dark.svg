<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">The agent was the bottleneck</title>
<desc id="desc">2023: you write prompts and read answers; the agent executes a few tool calls on software and explores what they return. The agent is the bottleneck: it loses the plan, repeats itself and stops too early.</desc>
