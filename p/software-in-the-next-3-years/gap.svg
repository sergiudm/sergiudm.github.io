<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
<title id="title">Agents got much better. Did you?</title>
<desc id="desc">An illustrative chart from 2023 to 2026. The line for what agents can do rises steeply. A dashed line for your productivity, if it had kept up, rises with it. The solid line for what you actually get done stays nearly flat. A large question mark sits in the widening gap between the two.</desc>
