<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" width="1200" height="668" role="img" aria-labelledby="title desc" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">The agent works on the app's state, not on its pixels</title>
<desc id="desc">An app has one state document and a page that is one view of it. You use the page. Your agent reads the state and runs commands directly, through access switches you set for each part of the state: what it may see and whether it may act, ask first, or not act. The old route, where the agent reaches the state through screenshots and clicks on the page, is shown as a long detour.</desc>
