<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">You and the agent share one interface</title>
<desc id="desc">One app window that you and your agent both use. A task board shows a task the agent suggested, with Add and Reject buttons; a task you circled with a pen and wrote a note on; and a task the agent just added, with undo. Shortcut keys accept, reject, undo and ask. A side panel has switches for what the agent can see and do in each part of the app, and the chat box is still there.</desc>
