  tldr: >-
    GUI agents fail in two predictable ways: they declare success too early, and they
    repeat the same failing action. VLAA-GUI adds a Completeness Verifier (when to stop),
    a Loop Breaker (when to recover), and an on-demand Search Agent (when to look things up).
  highlights:
