<footer class="site-footer">
  <div class="container site-footer__inner">
    <p>© {{ with site.Params.since }}{{ if lt . now.Year }}{{ . }}–{{ end }}{{ end }}{{ now.Year }} {{ site.Params.author.name }}.
      Posts are licensed under <a href="{{ site.Params.article.licenseURL }}">{{ site.Params.article.license }}</a>.</p>
    <p class="site-footer__links">
      {{- range site.Params.social }}{{ if .url }}<a href="{{ .url | relURL }}" aria-label="{{ .name }}" title="{{ .name }}">{{ partial "icon.html" .icon }}</a>{{ end }}{{ end }}
      <span class="site-footer__built">Built with <a href="https://gohugo.io">Hugo</a></span>
    </p>
  </div>
</footer>
