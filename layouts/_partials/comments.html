{{- with site.Params.comments.giscus }}
{{- if and .repo .repoID (ne $.Params.comments false) }}
<section class="comments" aria-label="Comments">
  <h2 class="comments__title">Discussion</h2>
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}" data-repo-id="{{ .repoID }}"
    data-category="{{ .category }}" data-category-id="{{ .categoryID }}"
    data-mapping="{{ .mapping | default "pathname" }}" data-strict="0" data-reactions-enabled="1"
    data-emit-metadata="0" data-input-position="top" data-theme="preferred_color_scheme"
    data-lang="en" data-loading="lazy" crossorigin="anonymous" async></script>
</section>
{{- end }}
{{- end }}
